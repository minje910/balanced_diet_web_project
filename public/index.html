<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>최적화 버전 - 데이터 기반 밸런스 식단</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        }

        body {
            background-color: #eef4ee;
            background-image: url('sdg-bg.png');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 24px;
            box-shadow: 0 12px 45px rgba(0, 0, 0, 0.15);
            padding: 40px;
            width: 100%;
            max-width: 520px;
            text-align: center;
        }

        .sdg-badge {
            display: inline-block;
            background-color: #4C9F38;
            color: white;
            font-size: 12px;
            font-weight: bold;
            padding: 6px 14px;
            border-radius: 20px;
            margin-bottom: 18px;
        }

        h1 {
            font-size: 24px;
            color: #2c3e50;
            margin-bottom: 10px;
            font-weight: 800;
        }

        .subtitle {
            font-size: 14px;
            color: #7f8c8d;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .status-panel {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 25px;
            font-size: 13px;
            color: #64748b;
            font-weight: 600;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #cbd5e1;
            border-radius: 50%;
            transition: background-color 0.3s;
        }

        .recommend-box {
            background-color: #fafbfc;
            border: 2px dashed #e2e8f0;
            border-radius: 18px;
            padding: 35px 20px;
            margin-bottom: 25px;
            min-height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }

        .food-name {
            font-size: 21px;
            font-weight: bold;
            color: #1a202c;
            margin-bottom: 10px;
        }

        .food-desc {
            font-size: 14px;
            color: #4a5568;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .nutrition-info {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 5px;
        }

        .nutri-tag {
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: 600;
        }

        .desc-origin {
            margin-top: 10px;
            font-size: 12px;
            color: #a0aec0;
            cursor: pointer;
            text-decoration: underline;
            user-select: none;
        }
        .desc-origin-text {
            margin-top: 6px;
            font-size: 12px;
            color: #94a3b8;
            font-style: italic;
            line-height: 1.5;
        }

        .action-links {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 18px;
        }
        .action-link {
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            padding: 9px 14px;
            border-radius: 10px;
            transition: transform 0.15s, opacity 0.15s;
        }
        .action-link:hover { transform: translateY(-1px); opacity: 0.88; }
        .action-link.recipe { background-color: #fff4e6; color: #dd6b20; }
        .action-link.place  { background-color: #e6f4ea; color: #2f855a; }

        .btn-recommend {
            background-color: #4C9F38;
            color: white;
            border: none;
            padding: 16px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 14px;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s;
            box-shadow: 0 5px 15px rgba(76, 159, 56, 0.2);
        }

        .btn-recommend:disabled {
            background-color: #cbd5e1;
            cursor: not-allowed;
            box-shadow: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="sdg-badge">GOAL 3. 건강과 복지</div>
        <h1>데이터 기반 밸런스 식단</h1>
        <p class="subtitle">맛없는 식단 대신, 대용량 CSV를 초고속으로<br>분석하여 유동적인 타협 식단을 제안합니다.</p>

        <div class="status-panel">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusTxt">CSV 데이터 로딩 중...</span>
        </div>

        <div class="recommend-box" id="recommendBox">
            <div class="food-name" id="displayTitle">데이터 준비 중</div>
            <div class="food-desc" id="displayDesc">정밀 최적화된 파서가 데이터를 읽어오고 있습니다.</div>
            <div class="nutrition-info" id="displayNutrition"></div>
            <div class="action-links" id="displayLinks"></div>
        </div>

        <button class="btn-recommend" id="recommendBtn" onclick="pickRandomMenu()" disabled>맛있는 건강식 추천받기</button>
    </div>

    <script>
        // 최적화된 고속 CSV 파서 함수 (정규식 미사용, 성능 극대화)
        function parseCSV(text) {
            const lines = [];
            let row = [""];
            let inQuotes = false;

            for (let i = 0; i < text.length; i++) {
                const c = text[i];
                const next = text[i+1];

                if (c === '"') {
                    if (inQuotes && next === '"') { row[row.length - 1] += '"'; i++; }
                    else { inQuotes = !inQuotes; }
                } else if (c === ',' && !inQuotes) {
                    row.push('');
                } else if ((c === '\r' || c === '\n') && !inQuotes) {
                    if (c === '\r' && next === '\n') { i++; }
                    lines.push(row);
                    row = [''];
                } else {
                    row[row.length - 1] += c;
                }
            }
            if (row.length > 1 || row[0] !== '') lines.push(row);
            return lines;
        }

        let filteredMenus = [];
        
        window.addEventListener('DOMContentLoaded', () => {
            const startTime = performance.now();
            
            fetch('dishes.csv')
                .then(response => {
                    if (!response.ok) throw new Error('파일 로드 실패');
                    return response.text();
                })
                .then(csvText => {
                    processOptimizedData(csvText, startTime);
                })
                .catch(error => {
                    console.error(error);
                    updateStatus('#e53e3e', '파일 접근 불가 (VS Code Live Server 필수)');
                    document.getElementById('displayTitle').innerText = "서버 환경 확인 필요";
                    document.getElementById('displayDesc').innerText = "보안(CORS) 정책으로 인해 그냥 파일을 열면 읽어올 수 없습니다. 반드시 Live Server를 통해 실행해 주세요.";
                });
        });

        function updateStatus(color, message) {
            document.getElementById('statusDot').style.backgroundColor = color;
            document.getElementById('statusTxt').innerText = message;
        }

        function processOptimizedData(csvText, startTime) {
            const rows = parseCSV(csvText);
            if (rows.length < 2) return;

            const headers = rows[0].map(h => h.trim().toLowerCase());
            const idxName = headers.indexOf('name');
            const idxDesc = headers.indexOf('description');
            const idxKcal = headers.indexOf('calories');
            const idxProtein = headers.indexOf('protein');
            const idxSlug = headers.indexOf('slug');

            const validMenus = [];
            const tastyKeywords = ['chicken', 'burger', 'omelet', 'beef', 'steak', 'pasta', 'bake', 'rice', 'cheese', 'tasty', 'pizza', 'sandwich'];

            for (let i = 1; i < rows.length; i++) {
                const row = rows[i];
                if (row.length <= Math.max(idxName, idxKcal, idxProtein)) continue;

                const name = row[idxName]?.trim();
                if (!name) continue;

                const kcal = parseFloat(row[idxKcal]);
                const protein = parseFloat(row[idxProtein]);

                if (isNaN(kcal) || isNaN(protein)) continue;

                const isHealthy = (kcal >= 300 && kcal <= 650) && (protein >= 15);
                if (!isHealthy) continue;

                const lowerName = name.toLowerCase();
                const isTasty = tastyKeywords.some(keyword => lowerName.includes(keyword));

                if (isTasty) {
                    const desc = row[idxDesc]?.trim() || "";
                    const slug = idxSlug >= 0 ? (row[idxSlug]?.trim() || "") : "";
                    validMenus.push({ name, desc, slug, kcal, protein });
                }
            }

            filteredMenus = validMenus;
            const endTime = performance.now();
            const processTime = ((endTime - startTime) / 1000).toFixed(2);

            if (filteredMenus.length > 0) {
                updateStatus('#4C9F38', `분석 완료 (${processTime}초) | ${filteredMenus.length}개 대기 중`);
                document.getElementById('recommendBtn').disabled = false;
                document.getElementById('displayTitle').innerText = "준비 완료!";
                document.getElementById('displayDesc').innerText = "최적화 필터링이 완료되었습니다. 버튼을 누르면 즉시 랜덤 식단이 표출됩니다.";
            } else {
                updateStatus('#dd6b20', "조건에 부합하는 메뉴가 존재하지 않습니다.");
            }
        }

        // 사용자 위치 1회 캐싱 (음식점 검색용)
        let userCoords = null;
        let geoAsked = false;
        function ensureGeo() {
            if (geoAsked || !navigator.geolocation) return Promise.resolve(null);
            geoAsked = true;
            return new Promise(resolve => {
                navigator.geolocation.getCurrentPosition(
                    pos => { userCoords = { lat: pos.coords.latitude, lng: pos.coords.longitude }; resolve(userCoords); },
                    () => resolve(null),
                    { timeout: 6000, maximumAge: 600000 }
                );
            });
        }

        // 영어 설명 -> 한국어 번역 (무료 엔드포인트, 실패 시 폴백)
        async function translateToKorean(text) {
            if (!text) return '';
            try {
                const url = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ko&dt=t&q=' + encodeURIComponent(text);
                const res = await fetch(url);
                if (!res.ok) throw new Error('google');
                const data = await res.json();
                const out = (data[0] || []).map(seg => seg[0]).join('').trim();
                if (out) return out;
                throw new Error('empty');
            } catch (e) {
                try {
                    const res = await fetch('https://api.mymemory.translated.net/get?langpair=en|ko&q=' + encodeURIComponent(text.slice(0, 480)));
                    const data = await res.json();
                    return (data.responseData && data.responseData.translatedText) || '';
                } catch (_) {
                    return '';
                }
            }
        }

        let pickToken = 0;
        async function pickRandomMenu() {
            if (filteredMenus.length === 0) return;

            const myToken = ++pickToken; // 빠른 연속 클릭 시 이전 번역 결과가 덮어쓰지 않도록
            const randomIndex = Math.floor(Math.random() * filteredMenus.length);
            const selected = filteredMenus[randomIndex];

            document.getElementById('displayTitle').innerText = selected.name;

            const FALLBACK_DESC = '데이터 기반으로 엄선된 영양 만점의 든든한 일상식 메뉴입니다.';
            const descEl = document.getElementById('displayDesc');
            descEl.innerText = selected.desc ? '설명 번역 중...' : FALLBACK_DESC;

            document.getElementById('displayNutrition').innerHTML = `
                <span class="nutri-tag" style="background-color: #ffeef0; color: #e53e3e;">🔥 ${selected.kcal} kcal</span>
                <span class="nutri-tag" style="background-color: #ebf8ff; color: #2b6cb0;">💪 단백질 ${selected.protein}g</span>
            `;

            // 링크 영역: ① 조리법  ② 주변 음식점
            const linksEl = document.getElementById('displayLinks');
            const recipeUrl = selected.slug
                ? 'https://tasty.co/recipe/' + selected.slug
                : 'https://www.google.com/search?q=' + encodeURIComponent(selected.name + ' recipe');
            linksEl.innerHTML =
                `<a class="action-link recipe" href="${recipeUrl}" target="_blank" rel="noopener">📖 조리법 보기</a>`;

            ensureGeo().then(coords => {
                if (myToken !== pickToken) return;
                const q = encodeURIComponent(selected.name + ' 식당');
                const mapUrl = coords
                    ? `https://www.google.com/maps/search/${q}/@${coords.lat},${coords.lng},12z`
                    : `https://www.google.com/maps/search/?api=1&query=${q}`;
                const a = document.createElement('a');
                a.className = 'action-link place';
                a.target = '_blank';
                a.rel = 'noopener';
                a.href = mapUrl;
                a.innerText = coords ? '📍 주변 음식점 찾기' : '📍 음식점 검색 (위치 미허용)';
                linksEl.appendChild(a);
            });

            const box = document.getElementById('recommendBox');
            box.style.borderColor = '#4C9F38';
            box.style.background = '#fcfdfc';

            // 설명 번역 (기본 한국어 출력 + 원문 토글)
            if (!selected.desc) return; // 원본 설명이 없으면 기본 문구 그대로 (번역 불필요)
            const ko = await translateToKorean(selected.desc);
            if (myToken !== pickToken) return; // 그 사이 다른 추천을 누른 경우 무시
            if (ko && ko !== selected.desc) {
                descEl.innerHTML =
                    `<span>${escapeHtml(ko)}</span>` +
                    `<div class="desc-origin" onclick="toggleOrigin(this)">원문 보기</div>` +
                    `<div class="desc-origin-text" style="display:none;">${escapeHtml(selected.desc)}</div>`;
            } else {
                descEl.innerText = selected.desc; // 번역 실패 시 원문 그대로
            }
        }

        function toggleOrigin(el) {
            const box = el.nextElementSibling;
            const open = box.style.display !== 'none';
            box.style.display = open ? 'none' : 'block';
            el.innerText = open ? '원문 보기' : '원문 숨기기';
        }

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c =>
                ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }
    </script>
</body>
</html>
